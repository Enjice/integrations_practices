services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: task1-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10

  producer:
    build: ./producer
    container_name: task1-producer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq

  brigade-1:
    build: ./consumer
    container_name: task1-brigade-1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      BRIGADE_NAME: brigade-1

  brigade-2:
    build: ./consumer
    container_name: task1-brigade-2
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      BRIGADE_NAME: brigade-2

  brigade-3:
    build: ./consumer
    container_name: task1-brigade-3
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      BRIGADE_NAME: brigade-3